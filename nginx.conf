server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MIME для современных ассетов
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json map webmanifest;
        image/webp                            webp;
        image/avif                            avif;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/x-icon                          ico;
        video/mp4                             mp4;
        video/webm                            webm;
        font/woff2                            woff2;
        font/woff                             woff;
        text/plain                            txt;
        application/xml                       xml;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Хешированные ассеты — долгий кэш
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # HTML не кэшируем, SPA-фолбэк
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri.html /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
